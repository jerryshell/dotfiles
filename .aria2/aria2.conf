# === RPC 服务 ===
# 认证推荐使用 token 方式，user/passwd 已不推荐
#rpc-user=user
#rpc-passwd=passwd
#rpc-secret=token
enable-rpc=true
# 允许跨域请求，Web 管理界面需要
rpc-allow-origin-all=true
# 监听所有网卡，false 则仅本机可访问
rpc-listen-all=true
# 默认端口被占用时才需修改
#rpc-listen-port=6800

# === 下载 ===
# 最大同时下载任务数
max-concurrent-downloads=5
# 断点续传
continue=true
# 单服务器最大连接数
max-connection-per-server=5
# 最小分片大小，决定单文件线程数上限，对小文件重要
min-split-size=10M
# 单文件最大线程数
split=10
# 自定义 Referer（部分站点防盗链需要）
#referer=*

# === 限速 ===（0 = 不限速）
max-overall-download-limit=0
max-download-limit=0
max-overall-upload-limit=0
max-upload-limit=0
# 速度过低时断开连接
#lowest-speed-limit=0

# === 会话持久化 ===（重启后恢复未完成任务）
#input-file=/Users/jerry/.aria2/aria2.session
#save-session=/Users/jerry/.aria2/aria2.session
#save-session-interval=60

# === 存储 ===
# 下载保存目录
dir=/Users/jerry/Downloads
# 预分配文件空间，减少碎片、提升磁盘性能（耗时较长）
file-allocation=prealloc
# 内核映射文件缓存（需内核支持）
#enable-mmap=true
# 内置文件缓存（不信任系统缓存时启用）
#disk-cache=0

# === BT ===
# 下载完成后不做种
seed-time=0
